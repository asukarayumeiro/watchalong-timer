<!DOCTYPE html>
<html lang="ja" data-theme="light" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="ストップウォッチ,stopwatch,マイナス,minus" />
    <meta
      name="description"
      content="同時視聴配信用のタイマーです。10秒前からのカウントダウンで開始タイミングをそろえることができます。"
    />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preload" href="/css/D-DIN-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/css/DSEG7Classic-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap&text=-:.0123456789" rel="stylesheet">
    <title>同時視聴用タイマー / Watchalong Timer</title>
    <meta property="og:title" content="同時視聴用タイマー / Watchalong Timer" />
    <meta
      property="og:description"
      content="同時視聴配信用のタイマーです。10秒前からのカウントダウンで開始タイミングをそろえることができます。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sync-timer.netlify.app/" />
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <header>
      <nav class="container">
        <ul>
          <li><strong style="font-size: xx-large">Title</strong></li>
        </ul>
      </nav>
    </header>
    <main>
      <div id="root"></div>
    </main>
    <footer>
        <div class="grid">
          <div class="footer-left">
          </div
          <div class="footer-right">
            <div>
              <a
                href="https://x.com/asukarayumeiro"
                target="_blank"
                rel="noopener noreferrer"
                ><i class="fab fa-twitter button-icon"></i>@asukarayumeiro
                </a
              >
            </div>
          </div>
        </div>
      </div>
    </footer>
    <dialog id="usage-dialog">
      <article>
        <header>
          <a
            href="#"
            aria-label="Close"
            class="close"
            onclick="closeDialog()"
          ></a
          >使い方を動画で見る
        </header>
        <div id="ytplayer"></div>
      </article>
    </dialog>
    <script async src="./js/index.js" type="module"></script>
    <script>
      // Load the IFrame Player API code asynchronously.
      const ytWidth = Math.min(window.innerWidth * 0.8, 1024);
      const ytHeight = (ytWidth / 16) * 9;
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/player_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      // Replace the 'ytplayer' element with an <iframe> and
      // YouTube player after the API code downloads.
      let player;
      function onYouTubePlayerAPIReady() {
        player = new YT.Player("ytplayer", {
          width: ytWidth,
          height: ytHeight,
          videoId: "m1Basm-TqGU",
        });
      }

      const usageDialog = document.getElementById("usage-dialog");
      const openDialog = () => {
        usageDialog.showModal();
      };
      const closeDialog = () => {
        if (player) player.pauseVideo();
        usageDialog.close();
      };
    </script>
    <script>
      const handleSubmit = (event) => {
        event.preventDefault();

        const myForm = event.target;
        const formData = new FormData(myForm);

        // 空文字の送信を止め、バリデーションメッセージを表示
        const urlInput = myForm.elements["user_url"];
        const trimmed = urlInput?.value?.trim() ?? "";
        if (!trimmed) {
          urlInput.setCustomValidity("URLを入力してください。");
          myForm.reportValidity();
          return;
        }
        urlInput.setCustomValidity("");
        formData.set("user_url", trimmed);

        fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(formData).toString(),
        })
          .then(() => {
            document.querySelector("#customer-url").remove();
            document.querySelector(".thanks").removeAttribute("style");
          })
          .catch((error) => alert(error));
      };

      document
        .querySelector("#customer-url")
        .addEventListener("submit", handleSubmit);
    </script>
  </body>
</html>
